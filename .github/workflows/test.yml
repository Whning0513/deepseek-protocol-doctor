name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m dsv4doctor check fixtures/valid_tool_loop.json
        env:
          PYTHONPATH: src
      - run: python -m dsv4doctor stream fixtures/stream_interleaved.jsonl
        env:
          PYTHONPATH: src
      - run: npm test
      - run: npm pack --dry-run
