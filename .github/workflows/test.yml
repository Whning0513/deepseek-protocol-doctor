name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m dsv4doctor check fixtures/valid_tool_loop.json
      - run: PYTHONPATH=src python -m dsv4doctor stream fixtures/stream_interleaved.jsonl
