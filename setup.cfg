[metadata]
name = deepseek-protocol-doctor
version = 0.1.0
description = Offline protocol and tool-loop diagnostics for DeepSeek V4-compatible clients
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = DeepSeek Protocol Doctor contributors
url = https://github.com/Whning0513/deepseek-protocol-doctor
keywords = deepseek, llm, tool-calling, openai-compatible, ci
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only

project_urls =
    Source = https://github.com/Whning0513/deepseek-protocol-doctor
    Issues = https://github.com/Whning0513/deepseek-protocol-doctor/issues

[options]
package_dir =
    =src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    dsv4-doctor = dsv4doctor.cli:main
